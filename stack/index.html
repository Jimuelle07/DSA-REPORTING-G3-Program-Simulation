<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Stack Undo/Redo Text Editor Simulation | DSA SIMS</title>
    <meta name="description" content="Try a stack-based text editor: type, undo, and redo changes to see last-in, first-out operations and their C code trace in action.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://dsa-reporting-g3-program-simulation.vercel.app/stack/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Stack Undo/Redo Text Editor Simulation | DSA SIMS">
    <meta property="og:description" content="Try a stack-based text editor: type, undo, and redo changes to see last-in, first-out operations and their C code trace in action.">
    <meta property="og:url" content="https://dsa-reporting-g3-program-simulation.vercel.app/stack/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Stack Undo/Redo Text Editor Simulation | DSA SIMS">
    <meta name="twitter:description" content="Try a stack-based text editor: type, undo, and redo changes to see last-in, first-out operations and their C code trace in action.">
    <meta name="twitter:url" content="https://dsa-reporting-g3-program-simulation.vercel.app/stack/">
    <meta name="theme-color" content="#F3E6D6">
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="../assets/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../assets/fonts/titan-one-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../assets/theme.css">
    <link rel="stylesheet" href="../assets/sim.css">
    <link rel="stylesheet" href="style.css">
    <script defer src="../assets/sw-register.js"></script>
    <script defer src="c-source.js"></script>
    <script defer src="stack.js"></script>
    <script defer src="history.js"></script>
    <script defer src="../assets/code-panel.js"></script>
    <script defer src="../assets/tour.js"></script>
    <script defer src="editor.js"></script>
  </head>
  <body class="page-stack">
    <header class="site-header">
      <a id="home-link" class="btn btn--white site-header__home" href="../index.html" aria-label="Home">← <span class="site-header__home-text">HOME</span></a>
      <a class="wordmark wordmark--small site-header__wordmark" href="../index.html" aria-label="DSA SIMS home"><span class="wordmark__l" style="--r:-5deg;--y:.02em">D</span><span class="wordmark__l" style="--r:-2deg;--y:-.01em">S</span><span class="wordmark__l" style="--r:2deg;--y:.02em">A</span><span class="wordmark__l wordmark__gap" style="--r:0deg"> </span><span class="wordmark__l" style="--r:-3deg;--y:.02em">S</span><span class="wordmark__l" style="--r:1deg;--y:-.01em">I</span><span class="wordmark__l" style="--r:4deg;--y:.02em">M</span><span class="wordmark__l" style="--r:2deg">S</span></a>
      <div class="site-header__actions">
        <details id="settings" class="settings">
          <summary class="btn btn-round settings__toggle" title="Settings">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-1"/><circle cx="16" cy="6" r="2.5"/><circle cx="10" cy="12" r="2.5"/><circle cx="18" cy="18" r="2.5"/></svg>
            <span class="visually-hidden">SETTINGS</span>
          </summary>
          <div class="settings__body">
            <fieldset class="pills">
              <legend>GRANULARITY</legend>
              <label><input type="radio" name="granularity" value="word" checked><span>WORD</span></label>
              <label><input type="radio" name="granularity" value="keystroke"><span>KEYSTROKE</span></label>
            </fieldset>
            <fieldset class="pills">
              <legend>CALLOUTS</legend>
              <label><input type="radio" name="callouts" value="on" checked><span>ON</span></label>
              <label><input type="radio" name="callouts" value="off"><span>OFF</span></label>
            </fieldset>
            <label class="settings__capacity" for="max-history">MAX HISTORY
              <select id="max-history">
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option selected>6</option>
              </select>
            </label>
          </div>
        </details>
        <button id="tour-start" type="button" class="btn btn-round" aria-haspopup="dialog" title="Show me around">TIPS</button>
      </div>
      <p class="eyebrow site-header__eyebrow">SIMULATION 01 · STACK (LIFO)</p>
      <h1 class="h2 site-header__title">UNDO / REDO TEXT EDITOR</h1>
    </header>

    <main class="sim">
      <section class="sim__editor" aria-label="Text editor controls">
        <label class="visually-hidden" for="editor">Document</label>
        <textarea id="editor" maxlength="255" spellcheck="false" autocomplete="off" aria-label="Document"></textarea>
        <p id="doc-count" class="eyebrow">0 / 255</p>

        <div id="controls" class="controls">
          <input id="word-input" type="text" maxlength="255" placeholder="word..." autocomplete="off" enterkeyhint="done" aria-label="Word to type">
          <button id="btn-type" type="button" class="btn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg>TYPE
          </button>
          <button id="btn-delete" type="button" class="btn btn--white">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>DELETE
          </button>
          <button id="btn-undo" type="button" class="btn btn--white">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5M5 9h8a7 7 0 0 1 0 14h-2"/></svg>UNDO
          </button>
          <button id="btn-redo" type="button" class="btn btn--white">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5m4 5h-8a7 7 0 0 0 0 14h2"/></svg>REDO
          </button>
        </div>
        <div id="bubble" class="bubble" role="status" aria-live="polite" hidden><p class="bubble__text"></p></div>
      </section>

      <section class="sim__stacks" aria-label="Undo and redo stacks">
        <div id="banner" class="banner" role="status" hidden></div>
        <section id="undo-stack" class="stack stack--undo" data-stack="undo" data-cap="6" aria-label="Undo stack">
          <header class="stack__header">
            <h2 class="stack__title">UNDO STACK</h2>
            <span class="stack__size">0 / 6</span>
            <div class="stack__actions">
              <button type="button" class="btn btn--white btn-peek" data-stack="undo">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>PEEK
              </button>
              <button type="button" class="btn btn--white btn-clear" data-stack="undo" title="Clear the undo stack">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>CLEAR
              </button>
            </div>
          </header>
          <span class="stamp stack__stamp" hidden>FULL</span>
          <ol class="stack__well" aria-live="polite"></ol>
          <p class="stack__top">top = -1</p>
        </section>
        <section id="redo-stack" class="stack stack--redo" data-stack="redo" data-cap="6" aria-label="Redo stack">
          <header class="stack__header">
            <h2 class="stack__title">REDO STACK</h2>
            <span class="stack__size">0 / 6</span>
            <div class="stack__actions">
              <button type="button" class="btn btn--white btn-peek" data-stack="redo">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>PEEK
              </button>
              <button type="button" class="btn btn--white btn-clear" data-stack="redo" title="Clear the redo stack">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>CLEAR
              </button>
            </div>
          </header>
          <span class="stamp stack__stamp" hidden>FULL</span>
          <ol class="stack__well" aria-live="polite"></ol>
          <p class="stack__top">top = -1</p>
        </section>
      </section>

      <section class="sim__panels" data-tab="code">
        <div class="tabs" role="tablist" aria-label="Code and log">
          <button id="tab-code" type="button" role="tab" aria-selected="true" aria-controls="code-panel">C CODE</button>
          <button id="tab-log" type="button" role="tab" aria-selected="false" aria-controls="log-panel">LOG</button>
        </div>
        <section id="code-panel" class="code-panel terminal" role="tabpanel" aria-labelledby="tab-code"></section>
        <section id="log-panel" class="log-panel terminal" role="tabpanel" aria-labelledby="tab-log">
          <h2 class="log-panel__title">&gt; OPERATION LOG</h2>
          <ol id="log" class="log"></ol>
        </section>
      </section>
    </main>
  </body>
</html>
